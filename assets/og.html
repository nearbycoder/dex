<!doctype html>
<!-- The link preview image (apps/web/public/landing/og.png, 1200×630). Re-render it after changing this or the screenshots:
     chrome --headless=new --hide-scrollbars --allow-file-access-from-files --window-size=1200,630 --screenshot=apps/web/public/landing/og.png assets/og.html -->
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #09090b; color: #f4f4f5; font-family: "Noto Sans", sans-serif; position: relative; }
  .glow { position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 520px 420px at 240px 300px, rgba(16,185,129,.20), transparent 70%),
      radial-gradient(ellipse 600px 500px at 980px 420px, rgba(16,185,129,.16), transparent 70%); }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse 700px 500px at 40% 50%, #000 30%, transparent 80%); }
  .left { position: absolute; left: 68px; top: 0; bottom: 0; width: 580px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 60px; height: 60px; filter: drop-shadow(0 10px 30px rgba(16,185,129,.55)); }
  .brand span { font-size: 44px; font-weight: 800; letter-spacing: -1px; }
  h1 { margin-top: 34px; font-size: 45px; white-space: nowrap; line-height: 1.12; font-weight: 700; letter-spacing: -1.2px; }
  h1 em { font-style: normal; display: block; background: linear-gradient(90deg, #6ee7b7, #34d399, #5eead4); -webkit-background-clip: text; color: transparent; padding-bottom: 4px; }
  p { margin-top: 22px; font-size: 21px; line-height: 1.45; color: #a1a1aa; max-width: 560px; }
  .url { margin-top: 34px; display: inline-flex; align-items: center; gap: 10px; font-size: 20px; color: #d4d4d8; font-weight: 500; }
  .url i { width: 9px; height: 9px; border-radius: 50%; background: #34d399; box-shadow: 0 0 12px #34d399; }
  .shot { position: absolute; left: 720px; top: 92px; width: 760px; border-radius: 18px; border: 1px solid rgba(255,255,255,.1);
    background: rgba(24,24,27,.85); padding: 8px; box-shadow: 0 30px 80px -10px rgba(0,0,0,.8), 0 0 0 1px rgba(0,0,0,.4); }
  .dots { display: flex; gap: 7px; padding: 4px 10px 10px; }
  .dots b { width: 11px; height: 11px; border-radius: 50%; background: #3f3f46; }
  .shot img { display: block; width: 100%; border-radius: 12px; }
  .phone { position: absolute; left: 670px; top: 352px; width: 156px; border-radius: 30px; border: 1px solid rgba(113,113,122,.6);
    background: #18181b; padding: 7px; transform: rotate(-4deg); box-shadow: 0 30px 60px -10px rgba(0,0,0,.85); }
  .phone img { display: block; width: 100%; border-radius: 24px; }
</style></head><body>
  <div class="glow"></div><div class="grid"></div>
  <div class="shot"><div class="dots"><b></b><b></b><b></b></div><img src="../apps/web/public/landing/vm-preview.webp"></div>
  <div class="phone"><img src="../apps/web/public/landing/mobile-chart.webp"></div>
  <div class="left">
    <div class="brand"><img src="../apps/web/public/favicon.svg"><span>Dex</span></div>
    <h1>Your personal AI agent, <em>with a computer of its own.</em></h1>
    <p>Live charts and forms, the models you choose, and a cloud VM per chat you can watch.</p>
    <div class="url"><i></i>trydex.dev · open source</div>
  </div>
</body></html>
