<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>Dex · Offline</title>
  <style>
    html, body { margin: 0; height: 100%; background: #09090b; color: #e4e4e7; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); text-align: center; box-sizing: border-box; }
    img { width: 64px; height: 64px; }
    h1 { margin: 8px 0 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
    p { margin: 0; color: #a1a1aa; font-size: 14px; max-width: 280px; line-height: 1.5; }
    button { margin-top: 8px; border: 0; border-radius: 10px; background: #059669; color: #fff; font: inherit; font-size: 14px; font-weight: 500; padding: 10px 20px; }
  </style>
</head>
<body>
  <main>
    <img src="/favicon.svg" alt="">
    <h1>You're offline</h1>
    <p>Dex needs a connection to reach your agent. Your chats and VM keep running in the cloud.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
  <script>addEventListener("online", () => location.reload())</script>
</body>
</html>
