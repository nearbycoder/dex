// The wire protocol's data classes (core/model) are immutable, decoded fresh from each message. Compose can't see that
// across the module boundary, so without this, every synced-state update re-runs every chat row and message even when
// nothing in it changed. ModelRegistry and the OpenUI runtime are mutable and stay out.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set
